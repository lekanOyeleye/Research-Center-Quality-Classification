services:

  # PostgreSQL database container
  db:
    # Use official PostgreSQL 15 Alpine image — lightweight version
    image: postgres:15-alpine
    
    # Read credentials from .env file — never hardcode secrets
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    # Map port 5432 on your machine to port 5432 inside the container
    ports:
      - "5432:5432"
    
    # Persist database data even when container stops — data survives restarts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    # Check PostgreSQL is fully ready before starting the API
    # pg_isready confirms PostgreSQL is accepting connections — not just running
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI application container
  api:
    # Build the image from our Dockerfile in the current directory
    build: .
    
    # Map port 8000 on your machine to port 8000 inside the container
    ports:
      - "8000:8000"
    
    # Pass environment variables into the container
    environment:
      # db is the service name above — containers talk to each other by name
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Path to the model inside the container — matches the volume mount below
      MODEL_PATH: /app/model/artifacts/kmeans_pipeline_model.pkl
    
    # Mount the local model folder into the container
    # Left side — your local machine: ./model
    # Right side — inside the container: /app/model
    # This means retraining just replaces the pickle file — no image rebuild needed
    volumes:
      - ./model:/app/model
    
    # Do not start API until PostgreSQL passes its healthcheck
    depends_on:
      db:
        condition: service_healthy

# Named volume for PostgreSQL data persistence
volumes:
  postgres_data: