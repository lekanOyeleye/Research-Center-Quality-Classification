apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-center-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-center-server
  template:
    metadata:
      labels:
        app: research-center-server
    spec:
      containers:
      - name: model-server
        image: research-center-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow.mlflow.svc.cluster.local"

---
apiVersion: v1
kind: Service
metadata:
  name: research-center-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: research-center-server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5001
  type: ClusterIP